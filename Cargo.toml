[package]
name = "kubernetes-reflector-rs"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Rust port of emberstack/kubernetes-reflector: mirrors Secrets and ConfigMaps across namespaces via annotations"

[dependencies]
base64 = "0.23.1"
futures-util = "0.3.34"
json-patch = "4.1.0"
k8s-openapi = { version = "0.28.0", features = ["v1_34"] }
kube = { version = "4.2.0", features = ["runtime", "rustls-tls"] }
regex = "1.12.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = { version = "0.7.19", features = ["rt"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = [
    "env-filter",
    "json",
    "local-time",
] }

[dev-dependencies]
tempfile = "3.27.0"
tokio-stream = "0.1.19"
